  <head>
    <meta charset="UTF-8" />

    <title>ピカピカかんじ | PikaPika Kanji</title>

    <!-- iOS Appearance -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ピカピカかんじ">

    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23FFD93D'/><path d='M50 15 C54 42 58 46 85 50 C58 54 54 58 50 85 C46 58 42 54 15 50 C42 46 46 42 50 15 Z' fill='white'/></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Zen Maru Gothic"', 'sans-serif'],
            },
            colors: {
              brand: {
                yellow: '#FFD93D',
                orange: '#FF8400',
                blue: '#4F95FF',
                green: '#6BCB77',
                pink: '#FF6B6B',
                cream: '#FFF5E4'
              }
            },
            animation: {
              'piko-jump-small': 'pikoJumpSmall 1.2s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95)',
              'shine-sweep': 'shineSweep 2.5s linear infinite',
              'sparkle-vivid': 'sparkleVivid 3s infinite ease-in-out',
            },
            keyframes: {
              pikoJumpSmall: {
                '0%, 100%': { transform: 'translateY(0) scale(1, 1)' },
                '10%': { transform: 'translateY(2px) scale(1.03, 0.97)' },
                '25%': { transform: 'translateY(-15px) scale(0.98, 1.02)' },
                '40%': { transform: 'translateY(0) scale(1.05, 0.95)' },
                '50%': { transform: 'translateY(0) scale(1, 1)' },
              },
              shineSweep: {
                '0%': { transform: 'translateX(-300%) skewX(-30deg)' },
                '100%': { transform: 'translateX(300%) skewX(-30deg)' },
              },
              sparkleVivid: {
                '0%, 100%': { opacity: 0, transform: 'scale(0) rotate(0deg)' },
                '50%': { opacity: 1, transform: 'scale(1.2) rotate(180deg)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      @media (prefers-color-scheme: dark) {
        body, #root, footer, div, h1, button, main {
          background-color: inherit;
          color: inherit;
        }
      }
      html, body {
        color-scheme: light !important;
        position: relative;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #FFF5E4 !important;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #root {
        width: 100%;
        height: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        background-color: #FFF5E4 !important;
      }
      
      /* 3D感のある、鮮やかな宝石ボタン（土台なし） */
      .vivid-jewel-button {
        background: radial-gradient(circle at 50% 30%, #FF9A8B 0%, #FF6A88 40%, #D4145A 100%);
        border-radius: 3.5rem;
        position: relative;
        border: 6px solid #FFFFFF;
        box-shadow: 
          inset 0 8px 15px rgba(255,255,255,0.8),
          inset 0 -12px 30px rgba(0,0,0,0.5),
          0 10px 25px rgba(212, 20, 90, 0.25),
          0 10px 0 #9B1C3D; /* 3D側面 */
        z-index: 10;
        transition: transform 0.1s cubic-bezier(0.17, 0.67, 0.83, 0.67);
      }

      .vivid-jewel-button:active {
        transform: translateY(8px) scale(0.98, 0.95) !important;
        box-shadow: 
          inset 0 8px 15px rgba(255,255,255,0.8),
          inset 0 -12px 30px rgba(0,0,0,0.5),
          0 2px 0 #9B1C3D;
      }

      /* ボタン表面の極上の輝き */
      .jewel-rim-light {
        position: absolute;
        top: 6%;
        left: 10%;
        width: 80%;
        height: 42%;
        background: linear-gradient(to bottom, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.2) 100%);
        border-radius: 3.5rem 3.5rem 50% 50%;
        pointer-events: none;
        z-index: 15;
        border-top: 2px solid #FFFFFF;
      }

      .vivid-sparkle-particle {
        position: absolute;
        background-color: #FFFFFF;
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        pointer-events: none;
        z-index: 50;
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.9));
      }

      .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* スクロールバー非表示 (Firefox用) */
      .no-scrollbar {
        scrollbar-width: none;
      }
      /* スクロールバー非表示 (Chrome, Safari用) */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
    </style>

  }
}
</script>
