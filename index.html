    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Zen Maru Gothic"', 'sans-serif'],
            },
            colors: {
              brand: {
                yellow: '#FFD93D',
                orange: '#FF8400',
                blue: '#4F95FF',
                green: '#6BCB77',
                pink: '#FF6B6B',
                cream: '#FFF5E4'
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      html, body {
        color-scheme: light !important;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #FFF5E4 !important;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background-color: #FFF5E4 !important;
      }
      
      /* 安全な余白確保（アプリとウェブ両対応） */
      .ios-padding-top {
        padding-top: max(12px, var(--safe-top));
      }
      .ios-padding-bottom {
        padding-bottom: max(12px, var(--safe-bottom));
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
      @keyframes dash-move { to { stroke-dashoffset: -24; } }
      .animate-dash-move { animation: dash-move 1s linear infinite; }
      @keyframes highlight-pulse {
        0% { box-shadow: 0 0 0 0 rgba(107, 203, 119, 0.4); transform: scale(1); }
        50% { box-shadow: 0 0 0 15px rgba(107, 203, 119, 0); transform: scale(1.02); }
        100% { box-shadow: 0 0 0 0 rgba(107, 203, 119, 0); transform: scale(1); }
      }
      .animate-highlight-pulse { animation: highlight-pulse 2s infinite ease-in-out; }
    </style>
