    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Zen Maru Gothic"', 'sans-serif'],
            },
            colors: {
              brand: {
                yellow: '#FFD93D',
                orange: '#FF8400',
                blue: '#4F95FF',
                green: '#6BCB77',
                pink: '#FF6B6B',
                cream: '#FFF5E4'
              }
            },
            animation: {
              'piko-jump-small': 'pikoJumpSmall 1.2s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95)',
              'shine-sweep': 'shineSweep 2.5s linear infinite',
              'sparkle-vivid': 'sparkleVivid 3s infinite ease-in-out',
            },
            keyframes: {
              pikoJumpSmall: {
                '0%, 100%': { transform: 'translateY(0) scale(1, 1)' },
                '10%': { transform: 'translateY(2px) scale(1.03, 0.97)' },
                '25%': { transform: 'translateY(-15px) scale(0.98, 1.02)' },
                '40%': { transform: 'translateY(0) scale(1.05, 0.95)' },
                '50%': { transform: 'translateY(0) scale(1, 1)' },
              },
              shineSweep: {
                '0%': { transform: 'translateX(-300%) skewX(-30deg)' },
                '100%': { transform: 'translateX(300%) skewX(-30deg)' },
              },
              sparkleVivid: {
                '0%, 100%': { opacity: 0, transform: 'scale(0) rotate(0deg)' },
                '50%': { opacity: 1, transform: 'scale(1.2) rotate(180deg)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      @media (prefers-color-scheme: dark) {
        body, #root, footer, div, h1, button, main {
          background-color: inherit;
          color: inherit;
        }
      }
      html, body {
        color-scheme: light !important;
        position: relative;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #FFF5E4 !important;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      #root {
        width: 100%;
        height: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        background-color: #FFF5E4 !important;
      }
      
      /* 花火の開花リング（開いた瞬間の淡い光輪） */
      .hanabi-ring {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255, 230, 0, 0.9);
        box-shadow: 0 0 16px rgba(255, 230, 0, 0.7), inset 0 0 10px rgba(255, 255, 255, 0.9);
        animation: hanabiRingExpand 0.55s ease-out forwards;
        pointer-events: none;
      }
      @keyframes hanabiRingExpand {
        0% {
          transform: translate(-50%, -50%) scale(0.2);
          opacity: 1;
        }
        70% {
          opacity: 0.6;
        }
        100% {
          transform: translate(-50%, -50%) scale(12);
          opacity: 0;
        }
      }

      /* お祝いメッセージ（飛び散るエフェクト） */
      .celebration-pop {
        animation: celebrationBurstVanish 2.5s cubic-bezier(0.15, 0.85, 0.35, 1.2) forwards;
        filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.9));
        pointer-events: none;
        will-change: transform, opacity;
      }
      @keyframes celebrationBurstVanish {
        0% { transform: scale(0) rotate(-45deg) translateY(80px); opacity: 0; }
        20% { transform: scale(1.3) rotate(10deg) translateY(-30px); opacity: 1; }
        40% { transform: scale(1) rotate(0deg) translateY(-40px); opacity: 1; }
        /* 浮遊しながら消えていく */
        70% { transform: scale(1.05) rotate(2deg) translateY(-100px); opacity: 0.8; }
        100% { transform: scale(0.7) rotate(-5deg) translateY(-250px); opacity: 0; }
      }

      /* 3Dボタンの装飾 */
      .vivid-jewel-button {
        background: radial-gradient(circle at 50% 30%, #FF9A8B 0%, #FF6A88 40%, #D4145A 100%);
        border-radius: 3.5rem;
        position: relative;
        border: 6px solid #FFFFFF;
        box-shadow: 
          inset 0 8px 15px rgba(255,255,255,0.8),
          inset 0 -12px 30px rgba(0,0,0,0.5),
          0 10px 25px rgba(212, 20, 90, 0.25),
          0 10px 0 #9B1C3D;
        z-index: 10;
        transition: transform 0.1s cubic-bezier(0.17, 0.67, 0.83, 0.67);
      }
      .vivid-jewel-button:active {
        transform: translateY(8px) scale(0.98, 0.95) !important;
        box-shadow: 
          inset 0 8px 15px rgba(255,255,255,0.8),
          inset 0 -12px 30px rgba(0,0,0,0.5),
          0 2px 0 #9B1C3D;
      }
      .jewel-rim-light {
        position: absolute;
        top: 6%; left: 10%; width: 80%; height: 42%;
        background: linear-gradient(to bottom, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.2) 100%);
        border-radius: 3.5rem 3.5rem 50% 50%;
        pointer-events: none; z-index: 15;
        border-top: 2px solid #FFFFFF;
      }
      .vivid-sparkle-particle {
        position: absolute;
        background-color: #FFFFFF;
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        pointer-events: none; z-index: 50;
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.9));
      }
      .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
